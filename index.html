<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yu Kakinoki</title>
<style>
  :root{
    --bg:#ffffff;
    --ink:#161512;
    --ease:cubic-bezier(.4,0,.1,1);
    --type:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --xfade:1.1s;       /* crossfade duration */
    --hh:clamp(46px,6vw,60px); /* header height */
    --gap:2px;           /* grid gutter */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--type);
    font-size:11px;font-weight:400;line-height:1.5;letter-spacing:.03em;
    text-transform:uppercase;overflow:hidden;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;letter-spacing:inherit;text-transform:inherit}

  /* HEADER — persistent across views */
  header.top{height:var(--hh);display:flex;align-items:center;justify-content:space-between;
    padding:0 clamp(14px,2.2vw,28px)}
  header.top a.home{opacity:1}
  header.top .loc{opacity:.55}
  header.top .mail{opacity:.55}

  main{position:relative;height:calc(100svh - var(--hh));overflow:hidden}

  /* the collage strip is the whole interface — opening a project doesn't
     navigate away, it just fades out the other tiles in place and slides
     that project's remaining images in beside the one that was clicked */
  .marquee{width:100%;height:100%;display:flex;align-items:center;
    overflow-x:auto;overflow-y:hidden;scroll-behavior:auto;
    scrollbar-width:none;-ms-overflow-style:none}
  .marquee::-webkit-scrollbar{display:none}
  .marquee.locked{overflow:hidden}
  .marquee-track{display:flex;align-items:flex-start;width:max-content;gap:var(--gap)}
  /* room to scroll a tile near the start of the strip all the way to center —
     without this, centering it would need a negative scrollLeft, which the
     browser just clamps to 0 and the tile never actually reaches center */
  .marquee-track.focused{padding-left:50vw}
  .tile{position:relative;display:flex;flex-direction:column;gap:8px;flex:0 0 auto;
    cursor:pointer;transition:opacity .7s var(--ease)}
  .tile>img,.tile>video{height:33vh;width:auto;display:block;background:#111;
    transition:opacity .3s var(--ease)}
  .tile .cap{opacity:0;pointer-events:none;transition:opacity .5s var(--ease);white-space:nowrap}
  .tile .cap .t{display:block;font-weight:500}
  .tile .cap .r{display:block;opacity:.6}
  .tile .cap .cta{display:inline-block;margin-top:.5em;border-bottom:1px solid var(--ink);padding-bottom:1px}
  .tile .cap .cta.none{opacity:.35;border:none;pointer-events:none}
  .marquee-track.hovering .tile{opacity:.15}
  .marquee-track.hovering .tile:hover{opacity:1}
  .tile:hover .cap{opacity:1;pointer-events:auto}

  /* an opened project: every other tile fades out, the clicked one stays its
     normal size, and its other images lay out as a masonry carousel beside
     it that you click through to swap the hero. the carousel is positioned
     absolutely (off the tile, not a flex sibling in the track) so its height
     never affects the row's own layout — a tall carousel used to grow the
     track and re-center everything vertically, shifting the hero image up
     the instant it appeared */
  .marquee-track.focused .tile{opacity:0;pointer-events:none}
  .marquee-track.focused .tile.selected{opacity:1;pointer-events:auto}
  .tile.selected .cap{opacity:1;pointer-events:auto}
  .carousel{position:absolute;top:0;left:100%;margin-left:8px;width:22vh;height:33vh;
    display:flex;flex-direction:column;gap:8px;overflow-y:auto;
    scrollbar-width:none;-ms-overflow-style:none;
    transition:left .35s var(--ease)}
  .carousel::-webkit-scrollbar{display:none}
  .sibling{width:100%;height:auto;flex:0 0 auto;display:block;background:#111;cursor:pointer;
    opacity:0;transform:translateX(120px);
    transition:transform .6s var(--ease),opacity .4s var(--ease)}
  .sibling.on{opacity:.55;transform:translateX(0)}
  .sibling.on:hover{opacity:.9}
  .sibling.active{opacity:1}

  /* sits just above the hero image without touching it — kept out of normal
     flow (rather than a flex child before the image) so the tile's own box
     still starts exactly at the image's top edge, which is what the
     masonry carousel aligns itself to */
  .back-arrow{position:absolute;left:0;bottom:calc(100% + 8px);font-size:18px;
    color:var(--ink);
    opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
  .back-arrow.show{opacity:.55;pointer-events:auto}
  .back-arrow:hover{opacity:1}

  @media(max-width:820px){
    body{font-size:12px}
    .tile>img,.tile>video{height:28.6vh}
    .carousel{width:18vh;height:28.6vh}
  }

  /* cursor confetti trail */
  .confetti{position:fixed;top:0;left:0;width:7px;height:11px;pointer-events:none;z-index:9999;
    will-change:transform,opacity;animation:confetti-fall .9s ease-out forwards}
  @keyframes confetti-fall{
    0%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:1}
    100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + 70px)) rotate(calc(var(--r) + 220deg));opacity:0}
  }
</style>
</head>
<body>

<header class="top">
  <a class="home" href="#" id="home-link">Yu Kakinoki</a>
  <span class="loc">Tokyo/London</span>
  <a class="mail" href="mailto:yukakinoki@gmail.com">yukakinoki@gmail.com</a>
</header>

<main>
  <button class="back-arrow" id="backArrow" aria-label="Back">&larr;</button>
  <div class="marquee" id="marquee">
    <div class="marquee-track" id="grid"></div>
  </div>
</main>

<script>
  const B="https://yukakinoki.com/images/";
  const U=p=>encodeURI(B+p);
  const slugify=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  const isVideo=s=>/\.(mp4|m4v|mov|webm)$/i.test(s);
  const PROJ=[
    {title:"C-Studios",role:"Web Design & Dev, Spatial Installation Design & Dev",year:"2026",link:"https://c-studios.co.uk/",cta:"Visit",
     imgs:["c-studios/PHOTO-2026-05-29-05-41-06.jpg","c-studios/PHOTO-2026-05-29-05-40-15.jpg","c-studios/PHOTO-2026-05-29-05-41-07.jpg","c-studios/cstudios-web.mp4","c-studios/cstudios-lib.mp4"]},
    {title:"Silk Road",role:"PM & Art Director",year:"2025",link:"https://youtu.be/sCntIugua9E",cta:"Watch",
     imgs:["silkroad/01.png","silkroad/02.png","silkroad/03.png"]},
    {title:"Mizuno MXR Space",role:"Art Director",year:"2025",link:"https://www.youtube.com/watch?v=Q3IbMZrDyHI",cta:"Watch",
     imgs:["mizuno/mizunomxr01.png","mizuno/mizunomxr02.png","mizuno/mizunomxr03.png","mizuno/mizunomxr04.png"]},
    {title:"Kaytranada — Space Invader",role:"Art Director",year:"2025",link:"https://youtu.be/jb2QPbQoZLI",cta:"Watch",
     imgs:["kaytranada/01-kaytranada.png","kaytranada/02-kaytranada.png","kaytranada/03-kaytranada.png","kaytranada/04-kaytranada.png"]},
    {title:"Posters & Flyers",role:"Graphic Designer",year:"2025–2026",link:"",cta:"",
     imgs:["gfx/PonPonPot.jpg","gfx/PonPon2year.jpg","gfx/ShokuponShinenkai.jpg","gfx/KatteniMatsuri.jpg","gfx/JazzPoster1.jpg","gfx/JazzPoster2.jpg","gfx/JazzPoster3.jpg"]},
    {title:"A Sundae For Breakfast",role:"Director & Producer",year:"2025",link:"",cta:"",
     imgs:["sundae/752631800_18039769250802635_4047172421191343384_n.jpg","sundae/752839437_18039769241802635_8874249738374554049_n.jpg"]},
    {title:"Freelance — Art Direction",role:"Art Assistant",year:"2025",link:"",cta:"",
     imgs:["freelance-art/babylonXbrooks01.png","freelance-art/babylonXbrooks02.png","freelance-art/babylonXbrooks03.png","freelance-art/budweiserXharoshi01.png","freelance-art/budweiserXharoshi02.png","freelance-art/budweiserXharoshi03.png","freelance-art/Screenshot 2026-02-08 at 19.16.55.png","freelance-art/Screenshot 2026-02-08 at 19.17.06.png","freelance-art/Screenshot 2026-02-08 at 19.17.39.png","freelance-art/Screenshot 2026-02-08 at 19.17.51.png"]},
    {title:"Freelance — Production",role:"Production Assistant",year:"2025",link:"",cta:"",
     imgs:["freelance-production/markgong01.jpeg","freelance-production/voguechina01.jpeg","freelance-production/voguechina02.jpeg","freelance-production/starbucksXbeams01.jpeg","freelance-production/starbucksXbeams02.jpeg","freelance-production/madhappy02.webp","freelance-production/madhappyXdisney01.jpeg","freelance-production/madhappyXdisney03 .jpeg"]},
    {title:"Eto Kentaro — Novel",role:"Book & Cover",year:"2025",link:"",cta:"",
     imgs:["etokentaro/eto01.jpeg","etokentaro/eto02.JPG","etokentaro/eto03.jpeg"]},
    {title:"Putotoy",role:"Web Designer",year:"2024",link:"https://putotoy.com/",cta:"Visit",
     imgs:["putotoy/putotoy1.png","putotoy/putotoy2.png","putotoy/putotoy3.png"]},
    {title:"Haco Hair Salon",role:"Web & Motion",year:"2023",link:"",cta:"",
     imgs:["haco/haco1.png","haco/haco2.png","haco/haco3.png","haco/business.png","haco/gogo.png","haco/igpost.png","haco/igstoryad.png","haco/hoxtonad.png"]}
  ];
  PROJ.forEach(p=>p.slug=slugify(p.title));

  const gridEl=document.getElementById('grid'),
        marqueeEl=document.getElementById('marquee'),
        mainEl=document.querySelector('main'),
        homeLink=document.getElementById('home-link'),
        backArrow=document.getElementById('backArrow');

  // build infinite collage strip — two passes of every project, back to back,
  // so the scroll position can wrap seamlessly at the halfway point
  for(let pass=0;pass<2;pass++){
    PROJ.forEach((p,i)=>{
      const t=document.createElement('div');
      t.className='tile';t.dataset.i=i;
      t.innerHTML=`<img src="${U(p.imgs[0])}" alt="${p.title}" loading="lazy" decoding="async">
        <span class="cap">
          <span class="line t">${p.title}</span>
          <span class="line r">${p.role} — ${p.year}</span>
          ${p.link?`<a class="line cta" href="${p.link}" target="_blank" rel="noopener">${p.cta}</a>`
                  :`<span class="line cta none">—</span>`}
        </span>`;
      const ctaLink=t.querySelector('a.cta');
      if(ctaLink) ctaLink.onclick=e=>e.stopPropagation();
      t.onclick=()=>openProject(i,t);
      gridEl.appendChild(t);
    });
  }

  // continuous auto-scroll, seamlessly wrapping through the duplicated content;
  // pauses only while the cursor is actually over a tile (not just anywhere
  // in the strip) so native trackpad/swipe scrolling can take over.
  // a private float accumulator drives scrollLeft — re-synced from the real
  // scrollLeft only at pause/resume boundaries — so sub-pixel motion never
  // gets rounded off and re-read back into itself frame after frame (which
  // is what was causing the visible stutter).
  const SCROLL_SPEED=28; // px/sec
  let mqPaused=false,lastTs=null,pos=0;
  function wrapScroll(){
    const half=gridEl.scrollWidth/2;
    if(marqueeEl.scrollLeft>=half) marqueeEl.scrollLeft-=half;
    else if(marqueeEl.scrollLeft<0) marqueeEl.scrollLeft+=half;
  }
  function mqTick(ts){
    if(lastTs==null) lastTs=ts;
    const dt=ts-lastTs; lastTs=ts;
    if(!mqPaused){
      pos+=SCROLL_SPEED*dt/1000;
      const half=gridEl.scrollWidth/2;
      if(half&&pos>=half) pos-=half;
      marqueeEl.scrollLeft=pos;
    }
    wrapScroll();
    requestAnimationFrame(mqTick);
  }
  requestAnimationFrame(mqTick);
  const mqResync=()=>{pos=marqueeEl.scrollLeft;mqPaused=false;};

  // dim every other tile and pause the auto-scroll while the cursor is over
  // a tile specifically — not just anywhere in the strip's empty space.
  // skipped entirely once a project is open: hovering the still-visible hero
  // tile would otherwise resume the ticker and silently drift scrollLeft
  // even though the strip is supposed to be locked in place
  gridEl.addEventListener('mouseover',e=>{
    if(gridEl.classList.contains('focused'))return;
    const t=e.target.closest('.tile');
    if(t){ gridEl.classList.add('hovering'); mqPaused=true; }
  });
  gridEl.addEventListener('mouseout',e=>{
    if(gridEl.classList.contains('focused'))return;
    if(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.tile'))return;
    gridEl.classList.remove('hovering');
    mqResync();
  });
  marqueeEl.addEventListener('touchstart',()=>mqPaused=true,{passive:true});
  marqueeEl.addEventListener('touchend',mqResync,{passive:true});

  // manual eased scroll tween — used instead of CSS scroll-behavior:smooth,
  // which doesn't reliably complete in every environment. a new call always
  // supersedes whatever tween is still in flight, so the two back-to-back
  // corrections on open glide smoothly instead of fighting over scrollLeft
  let scrollTweenId=0;
  function animateScrollLeft(target,onDone,duration=450){
    const myId=++scrollTweenId;
    const start=marqueeEl.scrollLeft,delta=target-start,t0=performance.now();
    function step(ts){
      if(myId!==scrollTweenId) return;
      const p=Math.min(1,(ts-t0)/duration);
      marqueeEl.scrollLeft=start+delta*(1-Math.pow(1-p,3));
      if(p<1) requestAnimationFrame(step); else if(onDone) onDone();
    }
    requestAnimationFrame(step);
  }

  let focusedTile=null, siblings=[], heroOriginalSrc=null, carouselEl=null;

  // centers the whole expanded block — the hero image plus its carousel,
  // once the carousel exists — not just the hero image on its own.
  // re-measures fresh each call so it self-corrects for any layout drift
  // instead of snapping
  function centerTile(onDone){
    if(!focusedTile) return;
    const rect=focusedTile.getBoundingClientRect();
    let blockWidth=rect.width;
    if(carouselEl) blockWidth=carouselEl.getBoundingClientRect().right-rect.left;
    const target=marqueeEl.scrollLeft+rect.left-(marqueeEl.clientWidth-blockWidth)/2;
    animateScrollLeft(target,onDone);
  }


  function openProject(i,tileEl){
    if(gridEl.classList.contains('focused')) return;
    const p=PROJ[i];
    focusedTile=tileEl;
    heroOriginalSrc=tileEl.querySelector('img').src;
    tileEl.classList.add('selected');
    tileEl.appendChild(backArrow); // sits above the clicked image, not overlapping it
    gridEl.classList.add('focused'); // adds the left padding centering needs
    // compensate the scroll position for that new padding in the same tick,
    // before the browser paints — otherwise the tile visibly jumps right the
    // instant it's added, and only then animates back, reading as a stray
    // slide-in. This keeps the very next paint visually identical to before,
    // so the tile's actual move-to-center animation is the only motion seen.
    marqueeEl.scrollLeft+=window.innerWidth*.5;
    marqueeEl.classList.add('locked'); // no manual scrolling once a project is open
    mqPaused=true;
    backArrow.classList.add('show');
    history.pushState({i},'','#'+p.slug);

    // the clicked image always comes to rest centered in the viewport,
    // moving there directly from wherever it currently is. it re-centers
    // once more when the carousel appears (below) to fit the whole block,
    // then never moves again — no ongoing/reactive re-centering, since that
    // reads as the view still scrolling on its own
    requestAnimationFrame(()=>centerTile());

    // once the rest of the strip has faded away, lay this project's other
    // images (and videos) out as a masonry carousel beside it — click one to
    // swap the hero. the carousel's box is sized by CSS the instant it's
    // created, so re-center right away to fit the hero+carousel as one block
    setTimeout(()=>{
      carouselEl=document.createElement('div');
      carouselEl.className='carousel';
      tileEl.appendChild(carouselEl);
      centerTile();
      siblings=p.imgs.map((src,k)=>{
        const vid=isVideo(src);
        const im=document.createElement(vid?'video':'img');
        im.className='sibling'+(k===0?' active':'');
        im.onerror=()=>im.remove();
        // muted/autoplay must be set before src, or the browser can evaluate
        // autoplay-eligibility too early and silently never actually play
        if(vid){
          im.muted=true;im.loop=true;im.autoplay=true;im.playsInline=true;
          im.src=U(src);
          im.play().catch(()=>{});
        }else{
          im.alt=p.title+' '+(k+1);im.decoding='async';
          im.src=U(src);
        }
        im.onclick=()=>{
          if(im.classList.contains('active'))return;
          swapHero(tileEl,p,src);
          siblings.forEach(s=>s.classList.toggle('active',s===im));
        };
        carouselEl.appendChild(im);
        return im;
      });
      // reveal all of them together, not one after another
      requestAnimationFrame(()=>siblings.forEach(im=>im.classList.add('on')));
    },700);
  }

  // swaps whichever element is currently the hero (image or video) for a
  // new source, replacing the element itself when the media type changes —
  // deliberately not re-centering, so swapping through the carousel doesn't
  // re-trigger the whole view sliding around every click
  function swapHero(tileEl,p,src){
    const current=tileEl.querySelector(':scope>img,:scope>video');
    const vid=isVideo(src);
    current.style.opacity=0;
    setTimeout(()=>{
      if(focusedTile!==tileEl)return; // project was closed mid-swap
      if((current.tagName==='VIDEO')===vid){
        current.src=U(src);
        current.style.opacity=1;
        if(vid){ current.load();current.play().catch(()=>{}); }
      }else{
        const next=document.createElement(vid?'video':'img');
        // muted/autoplay must be set before src (see note above)
        if(vid){
          next.muted=true;next.loop=true;next.autoplay=true;next.playsInline=true;
          next.src=U(src);
          next.play().catch(()=>{});
        }else{
          next.alt=p.title;next.decoding='async';
          next.src=U(src);
        }
        current.replaceWith(next);
        requestAnimationFrame(()=>next.style.opacity=1);
      }
    },200);
  }

  function closeProject(push=true){
    if(focusedTile){
      gridEl.classList.remove('focused');
      marqueeEl.classList.remove('locked');
      focusedTile.classList.remove('selected');
      // the hero may have been swapped to a <video> while browsing the
      // carousel — always restore a plain <img> at the original src so the
      // grid tile is back to exactly what it was before it was opened
      const current=focusedTile.querySelector(':scope>img,:scope>video');
      if(current.tagName==='VIDEO'){
        const img=document.createElement('img');
        img.src=heroOriginalSrc;img.alt=focusedTile.dataset.i!=null?PROJ[focusedTile.dataset.i].title:'';
        img.decoding='async';
        current.replaceWith(img);
      }else{
        current.src=heroOriginalSrc;
        current.style.opacity=''; // clear any leftover mid-swap fade, so every
                                   // tile is back at the same default opacity
      }
      if(carouselEl) carouselEl.remove();
      carouselEl=null;
      siblings=[];
      focusedTile=null;
      backArrow.classList.remove('show');
      mainEl.prepend(backArrow);
      pos=marqueeEl.scrollLeft; mqPaused=false;
    }
    if(push) history.pushState({},'','#');
  }

  homeLink.onclick=e=>{e.preventDefault();closeProject();};
  backArrow.onclick=e=>{e.stopPropagation();closeProject();};

  window.addEventListener('popstate',e=>{
    const st=e.state;
    if(st&&st.i!=null){
      const t=gridEl.querySelector(`.tile[data-i="${st.i}"]`);
      if(t) openProject(st.i,t);
    } else closeProject(false);
  });

  window.addEventListener('keydown',e=>{
    if(e.key==='Escape') closeProject();
  });

  // initial route
  const startSlug=location.hash.replace('#','');
  const startIdx=PROJ.findIndex(p=>p.slug===startSlug);
  if(startIdx>=0){
    const t=gridEl.querySelector(`.tile[data-i="${startIdx}"]`);
    if(t) openProject(startIdx,t);
  }

  // cursor confetti trail — neon pink / yellow / purple
  const CONFETTI_COLORS=['#ff2ea6','#f4ff2e','#b026ff'];
  let cfLastX=null,cfLastY=null;
  function spawnConfetti(x,y){
    const el=document.createElement('span');
    el.className='confetti';
    el.style.background=CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    el.style.setProperty('--x',x+'px');
    el.style.setProperty('--y',y+'px');
    el.style.setProperty('--dx',((Math.random()-.5)*60)+'px');
    el.style.setProperty('--r',(Math.random()*360)+'deg');
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove(),{once:true});
  }
  window.addEventListener('pointermove',e=>{
    if(e.pointerType&&e.pointerType!=='mouse')return;
    if(cfLastX!==null&&Math.hypot(e.clientX-cfLastX,e.clientY-cfLastY)<14)return;
    cfLastX=e.clientX;cfLastY=e.clientY;
    spawnConfetti(e.clientX,e.clientY);
  });
</script>
</body>
</html>
