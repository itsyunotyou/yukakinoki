<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yu Kakinoki</title>
<style>
  :root{
    --bg:#ededea;
    --ink:#161512;
    --ease:cubic-bezier(.4,0,.1,1);
    --type:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --xfade:1.1s;       /* crossfade duration */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--type);
    font-size:11px;font-weight:400;line-height:1.5;letter-spacing:.03em;
    text-transform:uppercase;overflow:hidden;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;letter-spacing:inherit;text-transform:inherit}

  .wrap{display:flex;height:100svh}

  /* LEFT — full-bleed flashing slideshow */
  .stage{position:relative;width:68%;overflow:hidden;background:#111;cursor:pointer;
    border-right:1px solid rgba(22,21,18,.14)}
  .layer{position:absolute;inset:0;opacity:0;transition:opacity var(--xfade) ease-in-out}
  .layer.on{opacity:1}
  .layer img{width:100%;height:100%;object-fit:cover;display:block}
  .held{position:absolute;left:14px;bottom:12px;z-index:2;color:#fff;mix-blend-mode:difference;
    opacity:0;transition:opacity .3s}
  .stage.hold .held{opacity:.8}

  /* RIGHT — project navigation + info */
  .right{width:32%;display:flex;flex-direction:column;justify-content:space-between;
    padding:clamp(18px,2.4vw,40px)}
  .right .id{display:flex;justify-content:space-between}
  .meta{align-self:flex-start;max-width:30ch}
  .meta>div{transition:opacity .45s var(--ease)}
  .meta.out>div{opacity:0}
  .meta .line{display:block}
  .meta .cta{display:inline-block;margin-top:1.5em;border-bottom:1px solid var(--ink);padding-bottom:2px}
  .meta .cta.none{opacity:.35;border:none;pointer-events:none}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
  .foot a.mail{opacity:.55;white-space:nowrap}
  .index{display:flex;flex-wrap:wrap;gap:11px}
  .index button{opacity:.28;border-bottom:1px solid transparent;padding-bottom:2px;
    transition:opacity .25s var(--ease),border-color .25s var(--ease)}
  .index button:hover{opacity:.65}
  .index button.on{opacity:1;border-bottom-color:var(--ink)}

  @media(max-width:820px){
    body{font-size:12px}
    .wrap{flex-direction:column}
    .stage{width:100%;flex:0 0 52svh;border-right:none;border-bottom:1px solid rgba(22,21,18,.14)}
    .right{width:100%;flex:1;padding:18px}
    .meta{max-width:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="stage" id="stage">
    <span class="held" id="held">held</span>
  </div>

  <div class="right">
    <div class="id">
      <span>Yu Kakinoki</span>
      <span>Tokyo/London</span>
    </div>

    <div class="meta" id="meta">
      <div>
        <span class="line" id="m-title"></span>
        <span class="line" id="m-role"></span>
        <span class="line" id="m-year"></span>
        <a class="cta" id="m-cta" target="_blank" rel="noopener"></a>
      </div>
    </div>

    <div class="foot">
      <div class="index" id="index"></div>
      <a class="mail" href="mailto:yukakinoki@gmail.com">yukakinoki@gmail.com</a>
    </div>
  </div>

</div>

<script>
  const B="https://yukakinoki.com/images/";
  const U=p=>encodeURI(B+p);
  const PROJ=[
    {title:"Silk Road",role:"PM & Art Director",year:"2025",link:"https://youtu.be/sCntIugua9E",cta:"Watch",
     imgs:["silkroad/01.png","silkroad/02.png","silkroad/03.png"]},
    {title:"Mizuno MXR Space",role:"Art Director",year:"2025",link:"https://www.youtube.com/watch?v=Q3IbMZrDyHI",cta:"Watch",
     imgs:["mizuno/mizunomxr01.png","mizuno/mizunomxr02.png","mizuno/mizunomxr03.png","mizuno/mizunomxr04.png"]},
    {title:"Kaytranada — Space Invader",role:"Art Director",year:"2025",link:"https://youtu.be/jb2QPbQoZLI",cta:"Watch",
     imgs:["kaytranada/01-kaytranada.png","kaytranada/02-kaytranada.png","kaytranada/03-kaytranada.png","kaytranada/04-kaytranada.png"]},
    {title:"C-Studios",role:"Web Designer",year:"2025",link:"https://c-studios.co.uk/",cta:"Visit",
     imgs:["c-studios/01-c-studios.png","c-studios/02-c-studios(1).png","c-studios/02-c-studios.png","c-studios/04-c-studios.png"]},
    {title:"Freelance — Art Direction",role:"Art Assistant",year:"2025",link:"",cta:"",
     imgs:["freelance-art/babylonXbrooks01.png","freelance-art/babylonXbrooks02.png","freelance-art/babylonXbrooks03.png","freelance-art/budweiserXharoshi01.png","freelance-art/budweiserXharoshi02.png","freelance-art/budweiserXharoshi03.png","freelance-art/Screenshot 2026-02-08 at 19.16.55.png","freelance-art/Screenshot 2026-02-08 at 19.17.06.png","freelance-art/Screenshot 2026-02-08 at 19.17.39.png","freelance-art/Screenshot 2026-02-08 at 19.17.51.png"]},
    {title:"Freelance — Production",role:"Production Assistant",year:"2025",link:"",cta:"",
     imgs:["freelance-production/markgong01.jpeg","freelance-production/voguechina01.jpeg","freelance-production/voguechina02.jpeg","freelance-production/starbucksXbeams01.jpeg","freelance-production/starbucksXbeams02.jpeg","freelance-production/madhappy02.webp","freelance-production/madhappyXdisney01.jpeg","freelance-production/madhappyXdisney03 .jpeg"]},
    {title:"Eto Kentaro — Novel",role:"Book & Cover",year:"2025",link:"",cta:"",
     imgs:["etokentaro/eto01.jpeg","etokentaro/eto02.JPG","etokentaro/eto03.jpeg"]},
    {title:"Push",role:"Art Director",year:"2024",link:"",cta:"",
     imgs:["push/jck1.png","push/jck2.png","push/casetify.webp"]},
    {title:"Putotoy",role:"Web Designer",year:"2024",link:"https://putotoy.com/",cta:"Visit",
     imgs:["putotoy/putotoy1.png","putotoy/putotoy2.png","putotoy/putotoy3.png"]},
    {title:"Haco Hair Salon",role:"Web & Motion",year:"2023",link:"",cta:"",
     imgs:["haco/haco1.png","haco/haco2.png","haco/haco3.png","haco/business.png","haco/gogo.png","haco/igpost.png","haco/igstoryad.png","haco/hoxtonad.png"]}
  ];

  const stage=document.getElementById('stage'),meta=document.getElementById('meta'),
        mT=document.getElementById('m-title'),mR=document.getElementById('m-role'),
        mY=document.getElementById('m-year'),mC=document.getElementById('m-cta'),
        index=document.getElementById('index'),held=document.getElementById('held');

  // build numbered index
  PROJ.forEach((p,i)=>{
    const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0');
    b.onclick=()=>loadProject(i);index.appendChild(b);
  });
  const idxBtns=[...index.children];

  const SPEED=1800;              // ms each image holds before crossfading
  let pj=-1, ci=0, layers=[], timer=null, paused=false;

  function loadProject(n){
    pj=(n+PROJ.length)%PROJ.length;const p=PROJ[pj];
    // rebuild flashing layers for this project
    [...stage.querySelectorAll('.layer')].forEach(l=>l.remove());
    layers=p.imgs.map(src=>{
      const d=document.createElement('div');d.className='layer';
      const i=document.createElement('img');i.src=U(src);i.alt=p.title;i.decoding='async';i.onerror=()=>i.remove();
      d.appendChild(i);stage.insertBefore(d,held);return d;
    });
    ci=0;layers[0].classList.add('on');
    // info
    meta.classList.add('out');
    setTimeout(()=>{
      mT.textContent=p.title;mR.textContent=p.role;mY.textContent=p.year;
      if(p.link){mC.textContent=p.cta;mC.href=p.link;mC.classList.remove('none');}
      else{mC.textContent="—";mC.removeAttribute('href');mC.classList.add('none');}
      meta.classList.remove('out');
    },220);
    ct_update();
    restart();
  }
  function ct_update(){ idxBtns.forEach((b,k)=>b.classList.toggle('on',k===pj)); }
  function tick(){
    if(layers.length<2)return;
    layers[ci].classList.remove('on');
    ci=(ci+1)%layers.length;
    layers[ci].classList.add('on');
  }
  function restart(){ clearInterval(timer); if(!paused) timer=setInterval(tick,SPEED); }
  function hold(){ paused=true;clearInterval(timer);stage.classList.add('hold'); }
  function resume(){ paused=false;stage.classList.remove('hold');restart(); }

  const next=()=>loadProject(pj+1), prev=()=>loadProject(pj-1);
  window.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='ArrowDown')next();
    if(e.key==='ArrowLeft'||e.key==='ArrowUp')prev();
  });

  // hover holds the flash so you can look; click steps to next image
  stage.addEventListener('mouseenter',hold);
  stage.addEventListener('mouseleave',resume);
  stage.addEventListener('click',()=>{ if(paused) tick(); });

  // mobile: tap holds/resumes, swipe changes project
  let sx=0,sy=0;
  stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  stage.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){ dx<0?next():prev(); }
    else { paused?resume():hold(); }
  },{passive:true});

  loadProject(0);
</script>
</body>
</html>
